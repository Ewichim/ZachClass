# Based on the CFSPOPCON v9.0.0 configuration.
# A smaller atomic grid keeps the one-time tutorial setup manageable.
# Increase to 50 density x 100 temperature points for the upstream grid.
globals:
  evolution_start:
    value: 1.0e-08
    units: s
  evolution_stop:
    value: 100.0
    units: s
  ne_tau:
    value:
    - 5.0e+16
    units: m^-3 s
  electron_density_resolution: 12
  electron_temp_resolution: 40
data_file_config:
  adf11:
    effective_recombination:
      prefix: ACD
      code: 1
      stored_units: cm**3 / s
      desired_units: m**3 / s
    effective_ionisation:
      prefix: SCD
      code: 2
      stored_units: cm**3 / s
      desired_units: m**3 / s
    charge_exchange_cross_coupling:
      prefix: CCD
      code: 3
      stored_units: cm**3 / s
      desired_units: m**3 / s
    recombination_and_bremsstrahlung:
      prefix: PRB
      code: 4
      stored_units: W cm**3
      desired_units: W m**3
    charge_exchange_emission:
      prefix: PRC
      code: 5
      stored_units: W cm**3
      desired_units: W m**3
    parent_cross_coupling:
      prefix: QCD
      code: 6
    cross_coupling:
      prefix: XCD
      code: 7
    line_emission_from_excitation:
      prefix: PLT
      code: 8
      stored_units: W cm**3
      desired_units: W m**3
    specific_line_emission:
      prefix: PLS
      code: 9
    mean_charge_state:
      prefix: ZCD
      code: 10
    mean_charge_state_squared:
      prefix: YCD
      code: 11
    mean_ionisation_potential:
      prefix: ECD
      code: 12
      stored_units: eV
      desired_units: eV
species:
  helium:
    atomic_symbol: He
    atomic_number: 2
    data_files:
      effective_recombination: 1996
      effective_ionisation: 1996
      line_emission_from_excitation: 1996
      recombination_and_bremsstrahlung: 1996
      charge_exchange_cross_coupling: 1996
      charge_exchange_emission: 1996
      mean_ionisation_potential: 1996
  oxygen:
    atomic_symbol: O
    atomic_number: 8
    data_files:
      effective_recombination: 1996
      effective_ionisation: 1996
      line_emission_from_excitation: 1996
      recombination_and_bremsstrahlung: 1996
      charge_exchange_cross_coupling: 1989
      charge_exchange_emission: 1989
      mean_ionisation_potential: 1996
  tungsten:
    atomic_symbol: W
    atomic_number: 74
    data_files:
      effective_recombination: 1989
      effective_ionisation: 1989
      line_emission_from_excitation: 1989
      recombination_and_bremsstrahlung: 1989
      charge_exchange_cross_coupling: 1989
      charge_exchange_emission: 1989
  xenon:
    atomic_symbol: Xe
    atomic_number: 54
    data_files:
      effective_recombination: 1989
      effective_ionisation: 1989
      line_emission_from_excitation: 1989
      recombination_and_bremsstrahlung: 1989
      charge_exchange_cross_coupling: 1989
      charge_exchange_emission: 1989
      mean_ionisation_potential: 1989
  argon:
    atomic_symbol: Ar
    atomic_number: 18
    data_files:
      effective_recombination: 1989
      effective_ionisation: 1989
      line_emission_from_excitation: 1989
      recombination_and_bremsstrahlung: 1989
      charge_exchange_cross_coupling: 1989
      charge_exchange_emission: 1989
      mean_ionisation_potential: 1989
