    levels: 6
    fmt: '%.0f'
  Q:
    plot: true
    color: tab:blue
    linewidth: 1.5
    label: '$Q$'
    fontsize: 9
    spacing: manual
    manuallevels: [1, 5, 10, 20]
    scale: specified
    levels: 4
    fmt: '%.0f'
  betaN:
    plot: false
